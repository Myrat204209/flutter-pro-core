name: my_template_app
description: "A production-ready Flutter enterprise template."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

workspace:
  - packages/app_ui
  - packages/data_provider
  - packages/form_inputs

dependencies:
  flutter:
    sdk: flutter
  app_ui:
  data_provider:
  form_inputs:
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.8
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.11.1

flutter:
  uses-material-design: true
