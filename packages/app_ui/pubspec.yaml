name: app_ui
description: "App UI Component & Design System Library."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  vector_graphics: ^1.1.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  flutter_gen_runner: ^5.13.0
  vector_graphics_compiler: ^1.1.18

flutter:
  assets:
    - assets/
    - assets/images/
    - assets/svg/

flutter_gen:
  assets:
    enabled: true
    outputs:
      directory_path_enabled: true
      package_parameter_enabled: true
  output: lib/src/generated/
  line_length: 80 
  integrations:
    image: true
    flutter_svg: true